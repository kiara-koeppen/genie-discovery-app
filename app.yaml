# Databricks App config for Genie Discovery
#
# BEFORE DEPLOYING TO YOUR WORKSPACE, update the four env vars below to match
# your environment. See README.md ("Deploy to your workspace") for details.

command:
  - python
  - app.py

# NOTE: OAuth scopes for the end-user OBO token are NOT set in app.yaml (the
# key is silently ignored). See README.md "Step 2b" for the `databricks apps
# update` command to configure user_api_scopes.

env:
  # REQUIRED. SQL Warehouse used for all UC metadata queries and engagement
  # storage. Find this in your workspace: SQL > SQL Warehouses > (select
  # warehouse) > Connection details > copy the ID from the end of the HTTP Path.
  - name: DATABRICKS_WAREHOUSE_ID
    value: "<your-warehouse-id>"

  # REQUIRED. Catalog where the engagement-storage Delta table lives.
  # The app's service principal must have CREATE TABLE on <CATALOG>.<SCHEMA>.
  - name: CATALOG
    value: "<your-catalog>"

  # REQUIRED. Schema under CATALOG where the engagement table is auto-created.
  # The schema must exist before first run; the table itself is created and
  # maintained automatically by ensure_table() on app startup.
  - name: SCHEMA
    value: "<your-schema>"

  # Optional. Databricks group whose members gate COE approval in Session 4.
  # Create this group in Account Console > User management > Groups, add your
  # COE reviewers as members, then put the group name here.
  - name: COE_GROUP_NAME
    value: "genie-coe-reviewers"

  # Optional. Databricks group whose members are restricted to a "Business
  # Owner" view of the app: they can read all engagements, edit Sessions 1
  # and 2, view Section 4, and click the "BO Approved" checkbox on benchmark
  # rows — but cannot edit Sections 3/5/6 or trigger any AI actions. If this
  # group is unset or empty, no users get the BO restriction (everyone
  # except COE acts as a default-access "analyst").
  - name: BO_GROUP_NAME
    value: "genie-bo-reviewers"

  # Optional. Model Serving endpoint used by every AI button (generate-plan,
  # draft-benchmarks, draft-metric-view-yaml, etc). Default is Haiku 4.5 for
  # speed and lower cost. The app's service principal needs CAN QUERY on
  # this endpoint.
  # Alternatives: databricks-claude-sonnet-4-6 (higher precision, slower),
  # databricks-claude-3-7-sonnet, databricks-gpt-oss-120b, or any
  # chat-completion-compatible served model.
  - name: LLM_ENDPOINT_NAME
    value: "databricks-claude-haiku-4-5"

  # Optional. Microsoft Teams Incoming Webhook URL. When an analyst marks an
  # engagement "Ready for COE Review" in Session 4, the app posts an Adaptive
  # Card to this webhook's channel (that's how the COE group gets notified —
  # everyone in the channel sees it). If unset/empty, the notification is
  # silently skipped and the status flip still works.
  #
  # To create the URL: in the target Teams channel, open the "Workflows" app >
  # "Post to a channel when a webhook request is received" template > finish,
  # then copy the generated HTTPS URL. (Legacy O365 "Incoming Webhook"
  # connector URLs also work but are being retired by Microsoft.)
  #
  # Recommended: store the URL in a Databricks secret and reference it here via
  # valueFrom instead of pasting it in plaintext.
  - name: TEAMS_COE_WEBHOOK_URL
    value: ""
